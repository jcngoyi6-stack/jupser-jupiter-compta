# Essai local de Jupiter Compta : docker compose up --build, puis http://localhost:3000
# Données de démonstration FICTIVES. Secrets de développement : ne pas utiliser en production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres-essai
    volumes:
      - jupiter-db:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jupiter"]
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    build: .
    image: jupiter-compta-essai
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://jupiter_app:app_dev_pw@db:5432/jupiter
      DATABASE_OWNER_URL: postgresql://jupiter_owner:owner_dev_pw@db:5432/jupiter
      JWT_SECRET: essai-local-uniquement-0123456789abcdef0123456789abcdef0123456789
      MASTER_KEY: ZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMtbG9uZyEhISE=
      PAYMENT_WEBHOOK_SECRET: essai-local
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      PUBLIC_VERIFY_BASE_URL: http://localhost:3000/verifier
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: sh -c "cd apps/api && npx prisma migrate deploy && node dist/seed.js && node dist/main.js"
    ports:
      - "4000:4000"

  web:
    image: jupiter-compta-essai
    pull_policy: never
    depends_on:
      - api
    command: sh -c "cd apps/web && npx next start -p 3000"
    ports:
      - "3000:3000"

volumes:
  jupiter-db:
