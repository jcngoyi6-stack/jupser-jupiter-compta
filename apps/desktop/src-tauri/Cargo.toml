[package]
name = "jupiter-compta"
version = "0.1.0"
description = "Jupiter Compta — ERP SYSCOHADA (JUPSER)"
authors = ["JUPSER"]
edition = "2021"

[lib]
name = "jupiter_compta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
